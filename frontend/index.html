<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#081014" />
  <title>INNOVEXA Urban Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">IX</div><div><strong>INNOVEXA</strong><small>Urban Intelligence</small></div></div>
      <button class="collapse-btn" id="collapseNav" aria-label="Collapse navigation">⇤</button>
      <nav id="nav"></nav>
      <div class="sidebar-foot"><span class="live-dot"></span><div><strong>LIVE URBAN INTELLIGENCE</strong><small>Simulated prototype data</small></div></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="zone"><span class="status-pill ok">Operational</span><span>Bengaluru Demo Zone</span></div>
        <button class="search-trigger" id="searchTrigger">⌕ Search events, buses, routes, plates <kbd>Ctrl K</kbd></button>
        <div class="top-actions">
          <button id="simToggle" class="icon-btn" title="Pause simulation">Ⅱ</button>
          <button id="presentationToggle" class="icon-btn" title="Presentation mode">▣</button>
          <button id="alertBell" class="icon-btn" title="Alerts">⚠ <span id="alertCount">0</span></button>
          <div class="clock" id="clock"></div>
          <button class="avatar" id="roleButton">CO</button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div id="drawer" class="drawer" aria-hidden="true"></div>
  <div id="modal" class="modal-backdrop hidden"></div>
  <div id="palette" class="palette-backdrop hidden">
    <div class="palette">
      <input id="paletteInput" autocomplete="off" placeholder="Search command or entity…" />
      <div id="paletteResults"></div>
    </div>
  </div>
  <div id="toastHost" class="toast-host"></div>

  <script src="app.js"></script>
</body>
</html>
